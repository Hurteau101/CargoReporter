{% extends 'base.html' %}
{% load socialaccount %}

{% block navbar %}{% endblock %}

{% block content %}
<div style="display:flex;align-items:center;justify-content:center;min-height:60vh">
    <div style="background:var(--navy-mid);border:1px solid var(--border);border-radius:16px;padding:3rem;text-align:center;max-width:400px;width:100%">
        <h1 style="font-family:'Barlow Condensed',sans-serif;font-size:2rem;font-weight:800;color:var(--ice);margin-bottom:0.5rem">
            Cargo<span style="color:var(--accent)">Reporter</span>
        </h1>
        <p style="color:var(--muted);font-size:0.85rem;margin-bottom:2rem">Are you sure you want to sign out?</p>
        <form method="post" action="{% url 'account_logout' %}">
            {% csrf_token %}
            <button type="submit" style="display:inline-flex;align-items:center;gap:0.5rem;padding:0.75rem 1.5rem;background:linear-gradient(135deg,var(--accent-dim),var(--steel));border:1px solid var(--accent);border-radius:8px;color:var(--white);font-family:'Barlow Condensed',sans-serif;font-size:0.95rem;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;cursor:pointer">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
                Sign Out
            </button>
        </form>
    </div>
</div>
{% endblock %}
