{% extends 'base.html' %}

{% block navbar %}{% endblock %}

{% block content %}
<div style="min-height:70vh;display:flex;align-items:center;justify-content:center">
    <div style="text-align:center;max-width:480px">
        <div style="font-family:'Barlow Condensed',sans-serif;font-size:7rem;font-weight:800;color:var(--navy-light);line-height:1;margin-bottom:0.5rem;letter-spacing:0.04em">403</div>
        <div style="width:60px;height:3px;background:var(--accent);margin:0 auto 1.5rem;border-radius:2px"></div>
        <h1 style="font-family:'Barlow Condensed',sans-serif;font-size:1.8rem;font-weight:800;color:var(--ice);letter-spacing:0.06em;text-transform:uppercase;margin:0 0 0.75rem">
            Access <span style="color:var(--accent)">Denied</span>
        </h1>
        <p style="color:var(--muted);font-size:0.9rem;line-height:1.6;margin:0 0 2rem">
            You don't have permission to access this page. If you believe this is an error, please contact your administrator.
        </p>
        <a href="/" style="display:inline-flex;align-items:center;gap:0.5rem;padding:0.65rem 1.5rem;background:linear-gradient(135deg,var(--accent-dim),var(--steel));border:1px solid var(--accent);border-radius:8px;color:var(--white);font-family:'Barlow Condensed',sans-serif;font-size:0.95rem;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;text-decoration:none">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"/></svg>
            Back to Home
        </a>
    </div>
</div>
{% endblock %}
